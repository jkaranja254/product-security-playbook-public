name: Public Artifact Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block internal workflow artifacts
        shell: bash
        run: |
          set -euo pipefail

          forbidden_paths='(^|/)(\.codex($|/)|AGENTS\.md$|.*CODEX_HANDOFF.*\.md$)'
          if git ls-files | grep -E "$forbidden_paths"; then
            echo "Forbidden public artifact detected."
            exit 1
          fi

      - name: Block AI-generation markers
        shell: bash
        run: |
          set -euo pipefail

          forbidden_markers='Generated by|AI-generated|ChatGPT|Codex|internal workflow'
          if git grep -nE "$forbidden_markers" -- .; then
            echo "Forbidden marker detected in tracked files."
            exit 1
          fi
